<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oneqr — links</title>
<style>
  :root { --primary:#6750A4; --on-primary:#fff; --secondary-container:#E8DEF8; --surface:#FDF8FF;
    --on-surface:#1D1B20; --surface-variant:#E7E0EC; --on-surface-variant:#49454F; --outline-variant:#CAC4D0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Roboto',system-ui,-apple-system,sans-serif; background:var(--surface); color:var(--on-surface);
    min-height:100vh; display:grid; justify-items:center; padding:32px 16px; }
  main { width:100%; max-width:560px; }
  h1 { font-weight:500; color:var(--primary); margin-bottom:4px; }
  p.sub { color:var(--on-surface-variant); margin-bottom:20px; }
  a.row { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--on-surface);
    background:#fff; border:1px solid var(--outline-variant); border-radius:20px; padding:12px 16px; margin:10px 0; }
  a.row:hover { border-color:var(--primary); }
  .chip { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; flex:none; }
  .name { font-weight:500; }
  .handle { color:var(--on-surface-variant); font-size:.85rem; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>All my links</h1>
  <p class="sub">Opened from one QR code — every profile in one place.</p>
  <div id="list"></div>
</main>
<script src="viewer.js"></script>
</body>
</html>
